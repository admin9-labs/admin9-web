name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v7
        with:
          path: admin9-web

      - name: Checkout API contract
        uses: actions/checkout@v7
        with:
          repository: admin9-labs/admin9-api-laravel
          ref: 989a15c0dca4ff390ba2a792a00a6ff1557b0d15
          path: admin9-api-laravel

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: admin9-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: admin9-web

      - name: Build admin9-ui
        run: pnpm build:ui
        working-directory: admin9-web

      - name: Check OpenAPI drift
        run: pnpm openapi:check
        working-directory: admin9-web

      - name: Run tests
        run: pnpm test
        working-directory: admin9-web

      - name: Check types
        run: pnpm type:check
        working-directory: admin9-web

      - name: Lint
        run: pnpm lint
        working-directory: admin9-web

      - name: Check internationalization
        run: pnpm i18n:check
        working-directory: admin9-web

      - name: Build production bundle
        run: pnpm build
        working-directory: admin9-web
