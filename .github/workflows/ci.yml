name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@v7
        with:
          path: admin9-web

      - name: Checkout API contract
        uses: actions/checkout@v7
        with:
          repository: admin9-labs/admin9-api-laravel
          ref: ba883e6529ae9e0393a61a86835b870759cdfa52
          path: admin9-api-laravel

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: admin9-web/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci
        working-directory: admin9-web

      - name: Build admin9-ui
        run: npm run build:ui
        working-directory: admin9-web

      - name: Check OpenAPI drift
        run: npm run openapi:check
        working-directory: admin9-web

      - name: Run tests
        run: npm test
        working-directory: admin9-web

      - name: Check types
        run: npm run type:check
        working-directory: admin9-web

      - name: Lint
        run: npm run lint
        working-directory: admin9-web

      - name: Check internationalization
        run: npm run i18n:check
        working-directory: admin9-web

      - name: Build production bundle
        run: npm run build
        working-directory: admin9-web
