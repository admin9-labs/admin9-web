name: Frontend checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin9-web
    steps:
      - name: Check out frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: admin9-web
          persist-credentials: false

      - name: Check out matching backend contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: admin9-labs/admin9-api-laravel
          # Merged Laravel PR #20; advance with frontend contract updates.
          ref: 9c2fd37b839d91a55d76b6df4bfb3d9dc423bccd
          path: admin9-api-laravel
          sparse-checkout: docs/api.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: admin9-web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: admin9-web/.node-version
          cache: pnpm
          cache-dependency-path: admin9-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies at every severity
        run: pnpm audit:dependencies

      - name: Test application behavior
        run: pnpm test:unit

      - name: Check API contracts and generated types
        run: |
          pnpm test:api-contract
          pnpm openapi:check

      - name: Type-check and build production assets
        run: pnpm build

      - name: Lint application code and styles
        run: |
          pnpm lint
          pnpm lint:styles
